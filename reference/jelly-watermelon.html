<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jelly Watermelon</title>
<!--
  PLAN
  Subject: a Japanese-style watermelon jelly, half a dome, served on a ceramic plate.
  Palette (from the dessert itself): flesh #FF4F6A, rind green #2E7D3A, rind stripe #1C5424,
  pith #F3F6E6, glaze white #F7F5F0, sage table #CBD8C2 → #E6ECDF.
  Type: Fraunces italic for the one caption, nothing else on screen.
  The one bold thing: the jelly itself — translucent cut face with suspended seeds, and a wobble that feels edible.
  Motion: one orchestrated moment (the jelly drops onto the plate and settles), then idle breathing and poke-to-wobble.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2B3A2C; --table: #CBD8C2; }
  html, body { margin: 0; height: 100%; background: var(--table); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 28px; text-align: center; pointer-events: none;
    font: italic 400 17px/1.2 "Fraunces", Georgia, serif; color: var(--ink); opacity: .72; letter-spacing: .01em;
  }
  @media (max-width: 600px) { .caption { bottom: 20px; font-size: 15px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c" aria-label="A watermelon jelly on a plate. Tap it to make it wobble; drag to look around."></canvas>
<p class="caption">Tap the jelly</p>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = verticalGradient('#BFD0B5', '#E9EFE3');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.035).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.42, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 2.6;
controls.maxDistance = 7;
controls.maxPolarAngle = Math.PI * 0.47;

const key = new THREE.DirectionalLight('#fff6ea', 1.6);
key.position.set(2.5, 4, 3);
scene.add(key);
const rim = new THREE.DirectionalLight('#e9fff0', 0.8);
rim.position.set(-3, 2, -2.5);
scene.add(rim);

// ---------- wobble: shared uniforms, injected into every jelly material ----------
const U = {
  uSquash: { value: 0 }, uShear: { value: new THREE.Vector2() },
  uRipple: { value: 0 }, uTime: { value: 0 }, uH: { value: 1.0 },
};
function wobbly(material) {
  material.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, U);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uSquash, uRipple, uTime, uH; uniform vec2 uShear;
        vec3 wobble(vec3 p) {
          float h = clamp(p.y / uH, 0.0, 1.0);
          p.y *= 1.0 - uSquash;
          p.xz *= 1.0 + 0.55 * uSquash * (0.35 + 0.65 * h);
          p.xz += uShear * h * h;
          float rip = uRipple * sin(uTime * 21.0 - h * 7.0) * h;
          p.xz *= 1.0 + rip * 0.05;
          p.y *= 1.0 - rip * 0.03;
          return p;
        }`)
      .replace('#include <project_vertex>', `
        vec4 mvPosition = vec4( transformed, 1.0 );
        #ifdef USE_INSTANCING
          mvPosition = instanceMatrix * mvPosition;
        #endif
        mvPosition.xyz = wobble( mvPosition.xyz );
        mvPosition = modelViewMatrix * mvPosition;
        gl_Position = projectionMatrix * mvPosition;`);
  };
  return material;
}

// ---------- materials ----------
const flesh = wobbly(new THREE.MeshPhysicalMaterial({
  color: '#ff5a74', transmission: 0.82, thickness: 1.6, roughness: 0.09, ior: 1.36,
  attenuationColor: new THREE.Color('#c3102f'), attenuationDistance: 0.32,
  clearcoat: 1, clearcoatRoughness: 0.04, specularIntensity: 1,
}));
const pith = wobbly(new THREE.MeshPhysicalMaterial({
  color: '#f3f6e6', transmission: 0.55, thickness: 0.25, roughness: 0.14, ior: 1.36,
  attenuationColor: new THREE.Color('#dfe9c8'), attenuationDistance: 0.5, clearcoat: 1, clearcoatRoughness: 0.06,
}));
const rindTex = stripeTexture();
const rind = wobbly(new THREE.MeshPhysicalMaterial({
  color: '#ffffff', map: rindTex, transmission: 0.28, thickness: 0.6, roughness: 0.1, ior: 1.36,
  attenuationColor: new THREE.Color('#1f5a28'), attenuationDistance: 0.6, clearcoat: 1, clearcoatRoughness: 0.03,
}));
const rindEdge = wobbly(new THREE.MeshPhysicalMaterial({
  color: '#2e7d3a', transmission: 0.3, thickness: 0.2, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05,
}));
const seedMat = wobbly(new THREE.MeshPhysicalMaterial({
  color: '#1b100c', roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.1,
}));

// ---------- the jelly: half a dome. Built with the dome on z >= 0 and the cut face on z = 0 ----------
const jelly = new THREE.Group();
const R = 1.0, R_PITH = 0.93, R_FLESH = 0.86, SEG = 96;
const halfDome = r => new THREE.SphereGeometry(r, SEG, SEG / 2, 0, Math.PI, 0, Math.PI / 2);
const cutFace = (r0, r1) => {
  const g = r0 === 0 ? new THREE.CircleGeometry(r1, SEG, 0, Math.PI) : new THREE.RingGeometry(r0, r1, SEG, 1, 0, Math.PI);
  g.rotateY(Math.PI); // face -z (outwards from the dome)
  return g;
};
const base = r => { const g = new THREE.CircleGeometry(r, SEG, 0, Math.PI); g.rotateX(Math.PI / 2); return g; };

jelly.add(new THREE.Mesh(halfDome(R), rind));
jelly.add(new THREE.Mesh(halfDome(R_FLESH), flesh));
jelly.add(new THREE.Mesh(cutFace(0, R_FLESH), flesh));
jelly.add(new THREE.Mesh(cutFace(R_FLESH, R_PITH), pith));
jelly.add(new THREE.Mesh(cutFace(R_PITH, R), rindEdge));
jelly.add(new THREE.Mesh(base(R), flesh));

// seeds: a loose ring behind the cut face plus a scatter through the volume
const seedGeo = new THREE.SphereGeometry(1, 16, 12);
seedGeo.translate(0, 0.35, 0); // teardrop-ish pivot
const seeds = new THREE.InstancedMesh(seedGeo, seedMat, 46);
const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
const up = new THREE.Vector3(0, 1, 0), dir = new THREE.Vector3();
let n = 0;
const rand = mulberry32(7);
function placeSeed(x, y, z, size) {
  dir.set(x, y, 0).normalize();
  q.setFromUnitVectors(up, dir);
  q.multiply(new THREE.Quaternion().setFromAxisAngle(up, (rand() - 0.5) * 0.8));
  s.set(0.034 * size, 0.06 * size, 0.017 * size);
  m.compose(p.set(x, y, z), q, s);
  seeds.setMatrixAt(n++, m);
}
for (let i = 0; i < 18; i++) { // the classic ring, seen through the cut face
  const a = 0.18 + (Math.PI - 0.36) * (i / 17) + (rand() - 0.5) * 0.08;
  const rr = 0.5 + (rand() - 0.5) * 0.12;
  placeSeed(Math.cos(a) * rr, Math.sin(a) * rr, 0.035 + rand() * 0.07, 0.9 + rand() * 0.25);
}
while (n < 46) { // deeper seeds, visible when you orbit
  const a = rand() * Math.PI, rr = 0.25 + rand() * 0.45, z = 0.15 + rand() * 0.55;
  const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
  if (Math.hypot(x, y, z) < 0.78) placeSeed(x, y, z, 0.8 + rand() * 0.3);
}
seeds.instanceMatrix.needsUpdate = true;
jelly.add(seeds);

const holder = new THREE.Group(); // turn the cut face toward the default camera
holder.rotation.y = Math.PI * 0.8;
holder.add(jelly);
scene.add(holder);

// ---------- plate + soft contact shadow ----------
const plateTop = 0.045;
const profile = [[0, 0], [1.15, 0], [1.38, 0.015], [1.6, 0.09], [1.68, 0.14], [1.64, 0.15], [1.5, 0.09], [1.3, 0.05], [1.1, plateTop], [0, plateTop]]
  .map(([x, y]) => new THREE.Vector2(x, y));
const plate = new THREE.Mesh(new THREE.LatheGeometry(profile, 128),
  new THREE.MeshPhysicalMaterial({ color: '#f7f5f0', roughness: 0.22, clearcoat: 0.8, clearcoatRoughness: 0.12 }));
scene.add(plate);
holder.position.y = plateTop;

const shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 2.6),
  new THREE.MeshBasicMaterial({ map: radialShadow(), transparent: true, depthWrite: false, opacity: 0.55 }));
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = plateTop + 0.002;
scene.add(shadow);
const tableShadow = new THREE.Mesh(new THREE.PlaneGeometry(5, 5),
  new THREE.MeshBasicMaterial({ map: radialShadow(), transparent: true, depthWrite: false, opacity: 0.35 }));
tableShadow.rotation.x = -Math.PI / 2;
tableShadow.position.y = -0.001;
scene.add(tableShadow);

// ---------- physics ----------
const st = { s: 0, vs: 0, sh: new THREE.Vector2(), vsh: new THREE.Vector2(), dropY: reduceMotion ? 0 : 1.4, vy: 0, landed: reduceMotion };
function poke(strength, dirLocal) {
  st.vs += 2.4 * strength;
  st.vsh.addScaledVector(dirLocal, 1.9 * strength);
  U.uRipple.value = Math.min(1, U.uRipple.value + 0.9 * strength);
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
canvas.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 8) return; // it was a drag
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.intersectObject(jelly, true).length) {
    const away = new THREE.Vector3(); camera.getWorldDirection(away);
    away.applyQuaternion(jelly.getWorldQuaternion(new THREE.Quaternion()).invert());
    poke(reduceMotion ? 0.35 : 1, new THREE.Vector2(away.x, away.z).normalize());
  }
});

// ---------- loop ----------
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 30), t = clock.elapsedTime;
  if (!st.landed) {
    st.vy -= 9.8 * dt; st.dropY += st.vy * dt;
    if (st.dropY <= 0) { st.dropY = 0; st.landed = true; poke(1.25, new THREE.Vector2(0.3, -0.2)); }
  }
  const rest = reduceMotion ? 0 : 0.012 * Math.sin(t * 2.3);
  st.vs += (-140 * (st.s - rest) - 5.5 * st.vs) * dt; st.s += st.vs * dt;
  st.vsh.x += (-110 * st.sh.x - 5 * st.vsh.x) * dt; st.vsh.y += (-110 * st.sh.y - 5 * st.vsh.y) * dt;
  st.sh.addScaledVector(st.vsh, dt);
  U.uRipple.value *= Math.exp(-dt * 2.6);
  U.uSquash.value = THREE.MathUtils.clamp(st.s, -0.35, 0.45);
  U.uShear.value.copy(st.sh).clampLength(0, 0.35);
  U.uTime.value = t;

  holder.position.y = plateTop + st.dropY;
  const k = 1 - Math.min(st.dropY / 1.4, 1);
  shadow.material.opacity = 0.55 * k;
  shadow.scale.setScalar(0.8 + 0.25 * (1 + U.uSquash.value));
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const d = w / h < 0.8 ? 6.2 : 4.3;
  if (!resize.done) { camera.position.set(0.6, 1.9, d).add(new THREE.Vector3(0, 0, 0)); resize.done = true; }
}
addEventListener('resize', resize);
resize();
frame();

// ---------- small helpers ----------
function verticalGradient(top, bottom) {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function stripeTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#4f9e46'; g.fillRect(0, 0, 1024, 256);
  g.fillStyle = '#1c5424';
  for (let i = 0; i < 9; i++) { // wavy dark stripes running pole to rim
    const x0 = (i + 0.5) * (1024 / 9);
    g.beginPath();
    for (let y = 0; y <= 256; y += 8) { const x = x0 + Math.sin(y * 0.09 + i) * 9 + Math.sin(y * 0.031 + i * 2) * 6; g.lineTo(x - 22 - (y / 256) * 8, y); }
    for (let y = 256; y >= 0; y -= 8) { const x = x0 + Math.sin(y * 0.09 + i) * 9 + Math.sin(y * 0.031 + i * 2) * 6; g.lineTo(x + 22 + (y / 256) * 8, y); }
    g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function radialShadow() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(40,30,25,0.55)'); gr.addColorStop(0.45, 'rgba(40,30,25,0.25)'); gr.addColorStop(1, 'rgba(40,30,25,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
</script>
</body>
</html>
