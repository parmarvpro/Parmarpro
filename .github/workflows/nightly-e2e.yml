name: Nightly E2E

# Runs the Playwright suite against the staging deployment every night (03:30 IST).
#
# Needs the repository secret STAGING_URL, the staging deployment's origin. Without
# it the run succeeds, prints a notice and runs nothing.
#
# VERCEL_AUTOMATION_BYPASS_SECRET is optional. Set it when the staging deployment
# is protected: Vercel → Settings → Deployment Protection → Protection Bypass for
# Automation. Without it, a protected deployment answers with a sign-in page.
#
# The authenticated journey stays skipped here, because the Clerk test secrets are
# not passed to this workflow. See tests/e2e/authenticated.spec.ts.

on:
  schedule:
    - cron: "0 22 * * *" # 22:00 UTC = 03:30 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright against staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check that the staging URL is set
        id: gate
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "::notice title=Nightly E2E skipped::STAGING_URL is not set. No tests were run."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.enabled == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the E2E suite against staging
        if: steps.gate.outputs.enabled == 'true'
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.gate.outputs.enabled == 'true'
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
