:root{--paper:#F4F1EA;--ink:#141413;--accent:#D97757}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink)}
body{display:grid;place-items:center;overflow:hidden}
main{display:flex;flex-direction:column;align-items:center;gap:16px}
canvas{display:block;width:min(100vw - 32px,100vh - 76px);height:auto;aspect-ratio:1/1;background:var(--paper);cursor:pointer}
p{margin:0;font:700 11px/1 Reel,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--paper);text-align:center}
p b{color:var(--accent);font-weight:700}

<body>
<main>
<canvas id="reel" width="1080" height="1080" aria-label="Fifteen-second motion graphics showreel"></canvas>
<p id="hint"><b id="snd">Click for sound</b> &nbsp;·&nbsp; Space pause &nbsp;·&nbsp; ← → frame &nbsp;·&nbsp; 1–8 shot</p>
</main>
<script>
(() => {
'use strict';

// ─────────────────────────────────────────────────────────────
//  Grid: 120 BPM → 1 beat = 0.5 s = 30 frames, 1 bar = 2 s.
//  One technique per bar, cuts land on bar lines.
// ─────────────────────────────────────────────────────────────
const W = 1080, H = 1080, FPS = 60, DUR = 15;
const PAPER = '#F4F1EA', INK = '#141413', ACC = '#D97757';
const PI = Math.PI, TAU = PI * 2;

const cv = document.getElementById('reel');
const ctx = cv.getContext('2d');

// ── easing ───────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (u, start, dur) => clamp((u - start) / dur);
const outExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const inExpo = t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10);
const ioExpo = t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2;
const outCubic = t => 1 - Math.pow(1 - t, 3);
const inCubic = t => t * t * t;
const ioCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const outQuint = t => 1 - Math.pow(1 - t, 5);
const outBack = (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const inBack = (t, s = 1.70158) => (s + 1) * t * t * t - s * t * t;
const wobble = (tau, f, d) => tau < 0 ? 0 : Math.exp(-d * tau) * Math.sin(TAU * f * tau);

// ── drawing helpers ──────────────────────────────────────────
const font = (w, s) => `${w} ${s}px Reel`;
const bg = c => { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); };
const clipRect = (x, y, w, h, fn) => { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); fn(); ctx.restore(); };
const poly = pts => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); };
const disc = (x, y, r, c) => { if (r <= 0) return; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); };
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arc(x + w - r, y + r, r, -PI / 2, 0);
  ctx.lineTo(x + w, y + h - r); ctx.arc(x + w - r, y + h - r, r, 0, PI / 2);
  ctx.lineTo(x + r, y + h); ctx.arc(x + r, y + h - r, r, PI / 2, PI);
  ctx.lineTo(x, y + r); ctx.arc(x + r, y + r, r, PI, PI * 1.5);
  ctx.closePath();
}

// Per-letter metrics; x is kerning-aware (prefix width minus own advance).
function measure(word, weight, size) {
  ctx.font = font(weight, size);
  const m = ctx.measureText(word), letters = [];
  for (let i = 0; i < word.length; i++) {
    const g = ctx.measureText(word[i]);
    letters.push({ ch: word[i], x: ctx.measureText(word.slice(0, i + 1)).width - g.width, adv: g.width,
      l: g.actualBoundingBoxLeft, r: g.actualBoundingBoxRight, a: g.actualBoundingBoxAscent, d: g.actualBoundingBoxDescent });
  }
  return { word, weight, size, letters, adv: m.width, l: m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight,
    a: m.actualBoundingBoxAscent, d: m.actualBoundingBoxDescent };
}
// Size a word so its ink is exactly `width` wide, centred on x = 540.
function fit(word, weight, width) {
  const ref = measure(word, weight, 100);
  const w = measure(word, weight, 100 * width / (ref.l + ref.r));
  w.x0 = 540 - (w.r - w.l) / 2;
  return w;
}
// Tracked (letter-spaced) small caps line, centred.
function tracked(text, weight, size, track) {
  ctx.font = font(weight, size);
  const xs = []; let x = 0;
  for (const ch of text) { xs.push(x); x += ctx.measureText(ch).width + track; }
  const w = x - track;
  return { text, weight, size, xs: xs.map(v => v + 540 - w / 2), w };
}

// ─────────────────────────────────────────────────────────────
//  Layout (needs the embedded font, so built after load)
// ─────────────────────────────────────────────────────────────
const LAY = {};
let CAP = 0.727;

function layout() {
  CAP = measure('H', 900, 100).a / 100;

  // Shot 1 — justified three-line stack
  const lines = ['SHOW', 'REEL', '2026'].map(w => fit(w, 900, 800));
  const gap = 30;
  let total = gap * 2; lines.forEach(l => { l.cap = l.size * CAP; total += l.cap; });
  let y = 540 - total / 2;
  lines.forEach(l => {
    l.base = y + l.cap; y = l.base + gap;
    l.pad = Math.round(l.size * 0.04);
    l.clipTop = Math.floor(l.base - l.cap - l.pad); l.clipBot = Math.ceil(l.base + l.pad);
    l.slide = l.clipBot - l.clipTop + 4;
  });
  LAY.type = lines;

  // Shot 2 — morph keyframes (resampled to N points, all starting at 12 o'clock, clockwise)
  const N = 300;
  const circle = r => { const p = []; for (let k = 0; k < 360; k++) { const a = -PI / 2 + TAU * k / 360; p.push([r * Math.cos(a), r * Math.sin(a)]); } return p; };
  const square = (h, r) => roundPoly([[0, -h], [h, -h], [h, h], [-h, h], [-h, -h]], r);
  const tri = (R, r) => roundPoly([-90, 30, 150].map(d => [R * Math.cos(d * PI / 180), R * Math.sin(d * PI / 180)]), r);
  const star = (ro, ri, n, r) => { const v = []; for (let k = 0; k < n * 2; k++) { const a = -PI / 2 + PI * k / n, rr = k % 2 ? ri : ro; v.push([rr * Math.cos(a), rr * Math.sin(a)]); } return roundPoly(v, r); };
  LAY.morph = [
    { pts: resample(circle(150), N), rot: 0 },
    { pts: resample(square(134, 26), N), rot: PI / 2 },
    { pts: resample(tri(196, 22), N), rot: PI * 4 / 3 },
    { pts: resample(star(214, 84, 4, 12), N), rot: TAU },
    { pts: resample(square(42, 0), N), rot: PI * 2.5 },
  ];

  // Shot 4 — composite path: the line from shot 3, then a figure-eight, twice
  const pts = [];
  for (let k = 0; k <= 160; k++) pts.push([lerp(120, 960, k / 160), 540]);
  const M = 1400;
  for (let loop = 0; loop < 2; loop++) for (let k = 1; k <= M; k++) { const s = TAU * k / M; pts.push([540 + 420 * Math.cos(s), 540 + 300 * Math.sin(2 * s)]); }
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  LAY.path = { pts, cum, LA: cum[160], L8: cum[160 + M] - cum[160] };

  // Shot 5 — slice type
  const n120 = fit('120', 900, 820), bpm = fit('BPM', 900, 820);
  [n120, bpm].forEach(w => { w.cap = w.size * CAP; w.base = 540 + w.cap / 2; w.top = Math.floor(w.base - w.cap - 14); w.bot = Math.ceil(w.base + 14); });
  LAY.n120 = n120; LAY.bpm = bpm;

  // Shot 6 — sticker outline in face (a,b) space
  LAY.sticker = roundPoly([[-.8, -.8], [.8, -.8], [.8, .8], [-.8, .8]], .24, 6);

  // Shot 8 — odometer lockup

// ─────────────────────────────────────────────────────────────
//  01 · KINETIC TYPE — masked per-letter stagger, block reveal

function shotType(u) {

    B.letters.forEach((g, i) => {
      const y = -(1 - outExpo(prog(u, 0.5 + (3 - i) * 0.035, 0.42))) * B.slide - inBack(prog(u, 1.5 + (3 - i) * 0.03, 0.26), 1.6) * B.slide;

  else if (u >= 1.5 && u < 1.64) span = [bx0, lerp(bx0, bx1, outExpo(prog(u, 1.5, 0.14)))];

// ─────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────
//  03 · STAGGER GRID — radial pop, diagonal domino, 3D flip ripple,

// ─────────────────────────────────────────────────────────────
//  04 · TRIM PATHS — the line from shot 3 becomes a travelling stroke

// ─────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────
//  05 · SLICE — sliced type: fly-in, sine displacement with a

// ─────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────

//       spin, layer twists on the 8ths, exploded view, implode
// ─────────────────────────────────────────────────────────────

ready.then(() => {
  if (params.has('t')) { playing = false; base = +params.get('t'); }
  anchor = clock();
  const loop = () => { fitScale(); render(reelTime()); requestAnimationFrame(loop); };
  loop();
});
cv.addEventListener('click', toggleSound);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') {
    e.preventDefault(); if (playing) togglePlay();
    base = (((Math.round(base * FPS) + (e.code === 'ArrowRight' ? 1 : -1)) / FPS) % DUR + DUR) % DUR;
  }
  else if (/^Digit[1-8]$/.test(e.code)) seek((+e.code.slice(5) - 1) * 2);
  else if (e.key === 'm') toggleSound();
  else if (e.key === 'r') seek(0);
});
})();
</script>
</body>
</html>
